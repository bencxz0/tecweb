<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Formulário html</h2>
    <form action="#">
        <div>
            <label for="nome_id">Nome Completo</label>
            <input type="text" id="nome_id" disabled value="Bianca Monteiro Nunes"> <br>

            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="email@email.com"> <br>
            
            <label for="senha">Senha</label>
            <input type="password" id="senha" required> <br>
            
            <label for="numero">Número</label>
            <input type="number" id="numero" min="0" max="10" step=".01" required> <br>
            
            <label for="data">Data</label>
            <input type="date" id="data" required> <br>
            
            <br><hr><br>
            
            <label for="cor">Cor</label>
            <input type="color" id="cor" value="teal"> <br>
            
            <label for="file">Arquivo</label>
            <input type="file" id="file"> <br> <br>
            
            <fieldset>
                
                <label for="checkbox">Checkbox</label> <br>
                <input type="checkbox" id="checkbox" checked> <span>bbd</span> <br>
                <input type="checkbox" id="checkbox"> <span>uaaaaa</span> <br>
                <input type="checkbox" id="checkbox"> <span>uennn</span> <br>
                
                <label for="radio">Radio</label> <br>
                <input type="radio" id="radio" name="sn" checked> <span>sim</span> <br>
                <input type="radio" id="radio" name="sn"> <span>nao</span> <br>
            </fieldset>
            
            <label for="hidden">Hidden</label> <br>
            <input type="hidden" id="hidden">
            
            <label for="Estado">Estado</label>
            
            <select name="estado" id="estado">
                <option value="BA">–– –– ––</option>
                <option value="BA">Bahia</option>
                <option value="PE">Pernambuco</option>
                <option value="AL">Alagoas</option>
                <option value="SE">Sergipe</option>
            </select>

            <br><br><hr><br>
            
            <input type="submit" value="Concluído">
            <input type="reset" value="Clear">
            <input type="button" value="Botao">
        </div>
    </form>
</body>
</html>
